[package]
name = "imageedit-thumbnail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Explorer thumbnail provider (COM in-proc DLL) for PSD previews"

[lib]
name = "imageedit_thumb"
# rlib so the `thumbtest` harness in this crate can link the shared helpers.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "thumbtest"
path = "src/bin/thumbtest.rs"

[dependencies]
imageedit-decode = { workspace = true }
image = { workspace = true }
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61"
