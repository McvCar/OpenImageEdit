[package]
name = "imageedit-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# "console": keep the Windows console subsystem so debug/CI runs print the
# JSON event stream. The release packager builds with --no-default-features,
# which makes main.rs switch to windows_subsystem = "windows" (no console
# window pops up for end users).
[features]
default = ["console"]
console = []

[[bin]]
name = "imageedit"
path = "src/main.rs"

[dependencies]
imageedit-core = { workspace = true }
imageedit-decode = { workspace = true }
imageedit-render = { workspace = true }
image = { workspace = true }

cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10" }
# Windows only: embeds assets/app.ico (and a version block) into the exe so
# Explorer, the taskbar and shortcuts all show the application icon.
winresource = "0.1"
