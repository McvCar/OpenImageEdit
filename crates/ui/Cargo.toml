[package]
name = "imageedit-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "imageedit"
path = "src/main.rs"

[dependencies]
imageedit-core = { workspace = true }
imageedit-decode = { workspace = true }
imageedit-render = { workspace = true }

cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[build-dependencies]
cxx-qt-build = { version = "0.10" }
