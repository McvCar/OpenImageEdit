[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/decode",
    "crates/render",
    "crates/ui",
    "crates/bench",
    "crates/thumbnail",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
description = "A lightweight Windows image editor built with Rust and Qt6/QML"

[workspace.dependencies]
imageedit-core = { path = "crates/core" }
imageedit-decode = { path = "crates/decode" }
imageedit-render = { path = "crates/render" }

image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
    # Artist / developer interchange formats (all pure Rust, no new DLLs).
    "tga",   # game texture exchange
    "dds",   # engine textures (READ-ONLY: DXT1/3/5 + uncompressed)
    "ico",   # app / favicon icons
    "qoi",   # compact lossless
    "pnm",   # pbm/pgm/ppm pipelines
    "hdr",   # radiance float maps (read; write via DynamicImage)
] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Vendored fork of psd 0.3.5 (unmaintained upstream): defensive fixes for
# files the upstream parser panics on (RLE channel shorter than the scanline
# table, Zip-compressed layers). A panic here aborts the app (release
# panic=abort) and breaks Explorer thumbnails.
[patch.crates-io]
psd = { path = "vendor/psd" }

# ---- 开发/测试构建 ----
#
# 默认的 dev profile 把所有依赖也按 opt-level 0 编译，代价在解码这种纯像素
# 循环上是灾难性的：同样一张 8160×6120 / 64MB 的 JPEG，
#   release 解码 614 ms，debug（依赖未优化）15 331 ms —— 25 倍。
# 用户看到的"打开大图太慢"，慢的其实是没优化的 zune-jpeg / image 缩放。
#
# 只优化图像管线上的依赖，**不用 `[profile.dev.package."*"]`**：那条规则会
# 连 cxx-qt-lib 一起重编（1000+ 个 MSVC 对象，十几分钟且容易卡住），
# 而对像素循环没有任何帮助。加新解码器时记得在这里补一行。
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
[profile.dev.package.qoi]
opt-level = 3
[profile.dev.package.psd]
opt-level = 3

# 这三块是自己的 crate，但跑的都是热循环（解码/降采样、预览合成、像素运算），
# 在 dev 下也值得优化。ui 保持 0：它主要是 cxx-qt 胶水，编译最贵、优化收益最小。
[profile.dev.package.imageedit-decode]
opt-level = 3
[profile.dev.package.imageedit-render]
opt-level = 3
[profile.dev.package.imageedit-core]
opt-level = 3

[profile.release]
# Thin LTO keeps cross-crate inlining (the cxx-qt bridge benefits from it) but
# is far cheaper than fat LTO.
lto = "thin"
# 16 codegen units instead of 1: codegen for each crate is split and run in
# parallel. `1` forced the whole program through one serial codegen pass and
# made every release build take >10 minutes — the single worst knob here.
# Thin LTO still merges the units, so the runtime cost is ~1-3%.
codegen-units = 16
# unwind (not abort): decode_psd_bytes wraps the vendored psd parser in
# catch_unwind so a malformed file surfaces as an error dialog instead of
# taking the app down. The thumbnail DLL profile below requires unwind too.
panic = "unwind"
strip = true

# Fast release-ish profile for iteration: no LTO, parallel codegen. Roughly a
# third of the release build time with ~5% slower code. Use it while testing a
# packaging change; ship with `--release`.
#   cargo build --profile quick -p imageedit-ui --no-default-features
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16

[profile.bench]
lto = "thin"
codegen-units = 1

# Release build for the Explorer thumbnail COM DLL. `panic = "unwind"` is
# mandatory: the DLL is loaded into explorer.exe, and `catch_unwind` in the
# provider is the last line of defence against residual panics in the PSD
# dependency chain. Build with:
#   cargo build -p imageedit-thumbnail --profile thumb
[profile.thumb]
inherits = "release"
panic = "unwind"
