[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/decode",
    "crates/render",
    "crates/ui",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
imageedit-core = { path = "crates/core" }
imageedit-decode = { path = "crates/decode" }
imageedit-render = { path = "crates/render" }

image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "bmp",
    "tiff",
    "webp",
] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = "thin"
codegen-units = 1
